<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Centsora — pick your partner's budget file</title>
    <style>
      body { font-family: system-ui, -apple-system, Roboto, sans-serif;
             margin: 0; padding: 24px; background: #F5F6F8; color: #1b1c1e; }
      #status { font-size: 16px; line-height: 1.5; }
      .hint { color: #5f6368; font-size: 14px; margin-top: 12px; }
      /* Chrome blocks the automatic redirect below because the Picker's
         callback runs without a user gesture, so this button is the primary
         return path, not a fallback — sized as an obvious, full-width tap
         target (device-verified 2026-07-27). */
      #fallback {
        display: block;
        margin-top: 20px;
        padding: 14px 20px;
        min-height: 48px;
        box-sizing: border-box;
        background: #16A34A;
        color: #ffffff;
        text-align: center;
        text-decoration: none;
        font-size: 17px;
        font-weight: 600;
        border-radius: 14px;
      }
    </style>
  </head>
  <body>
    <p id="status">Opening your Google Drive…</p>
    <p class="hint" id="hint"></p>
    <a id="fallback" href="#" hidden>Return to Centsora</a>

    <script>
      // Centsora file picker (T42).
      //
      // NOTE: this page is published to GitHub Pages BY HAND — it must be
      // redeployed there after any edit; editing this checked-in copy alone
      // changes nothing live.
      //
      // Google's `trigger_onepick` OAuth picker stopped completing on Android
      // in July 2026: the picker renders, Insert fires, and the page never
      // navigates — reproduced on two devices, two accounts, in a Custom Tab,
      // in full Chrome, and with no Centsora code running at all, while the
      // same URL still completes in desktop Chrome. This page replaces only
      // the FILE SELECTION step with the JS Picker, and does its own return
      // hop, which is the mechanism that does still work (it is how sign-in
      // gets back into the app).
      //
      // It must run in a Chrome Custom Tab, NOT an in-app WebView: the Picker
      // requires the user's Google session cookies, and a fresh WebView has
      // none ("Can't access your Google Account" — verified 2026-07-27).
      //
      // Parameters arrive in the URL FRAGMENT, never the query string, so the
      // access token is not sent to GitHub Pages and stays out of server logs:
      //   #token=<oauth access token>&key=<browser api key>&appid=<project number>
      //   &state=<opaque echo>            (optional, returned untouched)
      //   &q=<filename filter>            (optional, pre-filters the list)
      //
      // Returns to the app via our OWN redirect:
      //   intent://picked?ids=<id,id>&state=<state>#Intent;scheme=com.centsora.app;package=com.centsora.app;end
      //   intent://cancelled?state=<state>#Intent;...
      //   intent://failed?reason=<code>&state=<state>#Intent;...

      var statusEl = document.getElementById('status');
      var hintEl = document.getElementById('hint');
      var fallbackEl = document.getElementById('fallback');
      var returned = false;

      function params() {
        var raw = (window.location.hash || '').replace(/^#/, '');
        var out = {};
        raw.split('&').forEach(function (pair) {
          if (!pair) return;
          var i = pair.indexOf('=');
          if (i < 0) return;
          out[decodeURIComponent(pair.slice(0, i))] =
            decodeURIComponent(pair.slice(i + 1));
        });
        return out;
      }

      var p = params();

      function backToApp(path, extra) {
        if (returned) return;
        returned = true;
        var query = extra || '';
        if (p.state) {
          query += (query ? '&' : '') + 'state=' + encodeURIComponent(p.state);
        }
        var target = 'intent://' + path + (query ? '?' + query : '') +
          '#Intent;scheme=com.centsora.app;package=com.centsora.app;end';
        fallbackEl.href = target;
        fallbackEl.hidden = false;
        // Drop the token from the address bar before leaving, so it does not
        // linger in Chrome history or the tab switcher.
        try {
          history.replaceState(null, '', window.location.pathname);
        } catch (e) { /* not fatal */ }
        window.location.replace(target);
      }

      function fail(reason, message) {
        statusEl.textContent = message;
        hintEl.textContent = 'Tap the button below to finish in Centsora.';
        backToApp('failed', 'reason=' + encodeURIComponent(reason));
      }

      if (!p.token || !p.key || !p.appid) {
        fail('missing-params', 'This link is incomplete. Start again from Centsora.');
      } else {
        var s = document.createElement('script');
        s.src = 'https://apis.google.com/js/api.js';
        s.onerror = function () {
          fail('api-load-failed', 'Could not reach Google. Check your connection and try again.');
        };
        s.onload = function () {
          statusEl.textContent = 'Loading the file picker…';
          gapi.load('picker', {
            callback: showPicker,
            onerror: function () {
              fail('picker-module-failed', 'Google’s file picker could not start.');
            }
          });
        };
        document.head.appendChild(s);
      }

      // Shared-with-me files only: the peer's budget file is never owned by
      // the person picking it.
      function sharedFilesView() {
        return new google.picker.DocsView(google.picker.ViewId.DOCS)
          .setIncludeFolders(false)
          .setSelectFolderEnabled(false)
          .setOwnedByMe(false);
      }

      // Broader than the exact QR-provided partner filename but still scoped
      // to Centsora-like `data-{deviceId}.json` names. Picker exposes name
      // search rather than a regex/prefix predicate, so `data-` is the
      // narrowest safe recovery hint that does not assume a specific peer.
      function centsoraFilesView() {
        return tune(sharedFilesView(), 'setQuery', 'data-');
      }

      // Optional Picker view tuning. `setQuery`/`setLabel` are only ever
      // convenience — narrowing and tab names. If a Picker build ever drops
      // or renames one, calling it blind would throw inside the builder and
      // take the ENTIRE picker down (picker-build-failed), killing pairing
      // for a cosmetic feature. Applying them only when present degrades to
      // a plain unlabelled list instead, which still pairs.
      function tune(view, method, value) {
        if (typeof view[method] === 'function') view[method](value);
        return view;
      }

      function showPicker() {
        try {
          var builder = new google.picker.PickerBuilder()
            .setOAuthToken(p.token)
            .setDeveloperKey(p.key)
            .setAppId(p.appid)
            .setTitle('Choose your partner’s Centsora file')
            .setCallback(onPicked);

          // With `q` the first view is narrowed to the file named by the QR,
          // so the user taps one file in a list of one. ALWAYS add the
          // broader Centsora-files view behind it: Picker's query is a name
          // search whose exact matching behaviour we do not control, and a
          // filter that matches nothing would otherwise strand the user in
          // an empty picker with no way to widen it. Two tabs = the narrowing
          // is a shortcut, never a trap.
          if (p.q) {
            builder.addView(
              tune(tune(sharedFilesView(), 'setQuery', p.q), 'setLabel', 'Your partner’s file'));
            builder.addView(tune(centsoraFilesView(), 'setLabel', 'Centsora files'));
          } else {
            builder.addView(centsoraFilesView());
          }

          builder.build().setVisible(true);
          statusEl.textContent = 'Choose the file, then tap Select.';
        } catch (e) {
          fail('picker-build-failed', 'Google’s file picker could not open.');
        }
      }

      function onPicked(data) {
        if (!data || !data.action) return;
        if (data.action === google.picker.Action.PICKED) {
          var docs = data.docs || [];
          var ids = docs.map(function (d) { return d.id; }).filter(Boolean);
          if (!ids.length) {
            fail('empty-selection', 'No file was selected.');
            return;
          }
          statusEl.textContent = 'Returning to Centsora…';
          hintEl.textContent = 'Tap the button below to finish in Centsora.';
          backToApp('picked', 'ids=' + encodeURIComponent(ids.join(',')));
        } else if (data.action === google.picker.Action.CANCEL) {
          statusEl.textContent = 'Cancelled. Returning to Centsora…';
          backToApp('cancelled', '');
        }
      }
    </script>
  </body>
</html>
